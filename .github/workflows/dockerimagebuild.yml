name:  build docker image and push to dockerhub
on:
    push:
        branches:
            - main
        paths-ignore:
            - "README.md"
            # - ".github/**"
            - "k8s_manifest/**"
            - "terraform/**"
            - "argocd/**"
            - "temp_sms_frontend_manifest/**"
            - "SS/**"
    workflow_dispatch:
        
        
jobs:
    compile:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v2
        - run: echo "Checked out code successful"


        - name: Set up node js
          uses: actions/setup-node@v4
          with:
            node-version: '20'

        - name: Frontend Compilation (syntax check)
          run: |
            cd frontend
            find . -name "*.js" -exec node --check {} +

        - name: Backend Compilation (syntax check)
          run: |
            cd backend
            find . -name "*.js" -exec node --check {} +

    scan:
        name: gitleaks
        needs: compile
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
            with:
              fetch-depth: 0

          - name: Run Gitleaks setup
            uses: gitleaks/gitleaks-action@v2

          # - name: Run Gitleaks scan
          #   run: |
          #     gitleaks detect --source ./backend --exit-code 1
          #     gitleaks detect --source ./frontend --exit-code 1



    #     # sonarQube analysis
    # sonarqube:
