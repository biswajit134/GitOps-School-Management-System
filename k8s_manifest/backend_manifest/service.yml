# Service for backend application
apiVersion: v1
kind: Service
metadata:
  name: sms-backend-service
  namespace: sms-backend
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  selector:
    app: sms-backend
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
  type: LoadBalancer