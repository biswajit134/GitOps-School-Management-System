# Deployment values for the SMS frontend application
replicaCount: 5

container:
  image: biswajit134/sms_frontend
  tag: latest
  imagePullPolicy: IfNotPresent
  port: 80

env:
  REACT_APP_BASE_URL: "http://20.204.221.24:5000/"
# Service configuration
service:
  # type: LoadBalancer
  type: ClusterIP
  port: 3000


resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "200m"