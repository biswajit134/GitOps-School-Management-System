# Deployment values for the SMS frontend application
replicaCount: 5

container:
  image: biswajit134/sms_frontend
  tag: latest
  imagePullPolicy: IfNotPresent
  port: 3000

env:
  REACT_APP_BASE_URL: "http://sms-backend-service.sms-backend.svc.cluster.local"
# Service configuration
service:
  type: LoadBalancer
  port: 3000


