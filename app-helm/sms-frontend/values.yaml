# Deployment values for the SMS frontend application
replicaCount: 2

container:
  image: biswajit134/sms_frontend
  tag: latest
  imagePullPolicy: IfNotPresent
  port: 80

env:
  REACT_APP_BASE_URL: "http://sms-backend-service.sms-app.svc.cluster.local:5000"
# Service configuration
service:
  type: LoadBalancer
  # type: ClusterIP
  port: 3000


resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "200m"